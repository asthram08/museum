<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16110d">
<title>EverAfter Museum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="trips.js"></script>
<style>
  :root{
    --wall:#16110d; --wall2:#221a14; --ink:#f4ead8; --muted:#b9a88c; --gold:#d8b25a;
    --plaque:#e9d7a8; --plaque-ink:#3b2a12; --accent:#b3342f;
    --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans:"Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;overflow-x:hidden}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  .kiosk{cursor:default;user-select:none;-webkit-user-select:none}

  /* ---------- top bar ---------- */
  .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;
       background:rgba(22,17,13,.85);backdrop-filter:blur(8px);border-bottom:1px solid rgba(216,178,90,.18)}
  .bar .brand{font-family:var(--serif);font-size:22px;letter-spacing:.14em;text-decoration:none;font-weight:600}
  .bar nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .pill{border:1px solid rgba(216,178,90,.45);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;
        font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px}
  .pill:hover{background:rgba(216,178,90,.12)}
  .pill.solid{background:var(--gold);color:#241807;border-color:var(--gold);font-weight:600}
  .kiosk .bar{display:none}

  /* ---------- gold frame ---------- */
  .frame{position:relative;padding:14px;border-radius:6px;
    background:linear-gradient(135deg,#7a5816 0%,#f3d98b 22%,#a47b24 45%,#f8e6a8 68%,#8a651c 100%);
    box-shadow:inset 0 0 0 2px rgba(60,40,5,.55),inset 0 0 0 6px rgba(255,240,190,.25),0 18px 40px rgba(0,0,0,.55)}
  .frame > .mat{background:#0d0906;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 18px rgba(0,0,0,.9);height:100%}
  .frame.oval, .frame.oval > .mat{border-radius:50%}
  .frame img{display:block;width:100%;height:100%;object-fit:cover}

  /* ---------- plaque ---------- */
  .plaque{background:linear-gradient(180deg,#f3e3b8,#d9c08a);color:var(--plaque-ink);border-radius:3px;padding:8px 12px;
    box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 0 0 1px rgba(90,60,10,.35);text-align:center;font-family:var(--serif)}
  .plaque b{display:block;font-size:19px;letter-spacing:.04em}
  .plaque small{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}

  /* ---------- medallion (when no keychain photo) ---------- */
  .medal{width:100%;height:100%;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 70%, white) 0%, var(--c) 45%, color-mix(in srgb,var(--c) 55%, black) 100%)}
  .medal .ring{width:78%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;
    border:3px solid rgba(255,235,180,.85);box-shadow:inset 0 0 0 6px rgba(0,0,0,.15)}
  .medal .ring span{font-family:var(--serif);color:#fff7e2;font-weight:700;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.35)}
  .medal .ring em{display:block;font-style:normal;font-family:var(--sans);font-size:.28em;letter-spacing:.2em;margin-top:.4em;opacity:.9}

  /* ---------- wall (home) ---------- */
  .hall{background:
      radial-gradient(ellipse at 50% -10%, rgba(255,210,140,.16), transparent 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 90px),
      var(--wall);min-height:calc(100vh - 65px);padding:40px 16px 80px}
  .kiosk .hall{min-height:100vh}
  .hero{text-align:center;max-width:720px;margin:0 auto 44px}
  .hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(46px,9vw,96px);letter-spacing:.12em;margin:0;line-height:1}
  .hero p{font-family:var(--serif);font-style:italic;font-size:clamp(18px,3.4vw,26px);color:var(--muted);margin:10px 0 0}
  .hint{display:inline-flex;align-items:center;gap:10px;margin-top:22px;font-size:14px;letter-spacing:.08em;color:var(--plaque)}
  .hint .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(216,178,90,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 14px rgba(216,178,90,0)}100%{box-shadow:0 0 0 0 rgba(216,178,90,0)}}
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:40px 28px;max-width:1100px;margin:0 auto}
  .grid .exhibit{width:clamp(140px,40vw,200px)}
  .exhibit{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:16px;transition:transform .25s}
  .exhibit:hover{transform:translateY(-4px)}
  .exhibit .frame{width:100%;aspect-ratio:1}
  .exhibit .spot{position:relative}
  .exhibit .spot:before{content:"";position:absolute;inset:-30px -10px auto;height:80px;background:radial-gradient(ellipse at 50% 0,rgba(255,220,160,.22),transparent 70%);pointer-events:none}
  .empty{max-width:560px;margin:0 auto;text-align:center;color:var(--muted)}

  /* ---------- trip: reveal ---------- */
  .reveal{position:relative;min-height:calc(100vh - 65px);display:grid;grid-template-columns:1fr minmax(220px,380px) 1fr;
    align-items:center;gap:24px;padding:40px 32px;overflow:hidden;
    background:radial-gradient(circle at 50% 48%, color-mix(in srgb,var(--c) 45%, #fff3e0) 0%, color-mix(in srgb,var(--c) 30%, #3a2a22) 32%, #140f0c 75%)}
  .kiosk .reveal{min-height:100vh}
  .kiosk .gallery{scroll-margin-top:0}
  .reveal .tag{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.24em;
    background:rgba(20,15,12,.55);border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:999px;white-space:nowrap}
  .reveal .left{text-align:right}
  .label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .dest{font-family:var(--serif);font-weight:600;font-size:clamp(40px,7vw,86px);line-height:.95;margin:6px 0;letter-spacing:.03em}
  .country{font-family:var(--serif);font-style:italic;font-size:clamp(20px,3vw,30px);color:var(--plaque)}
  .facts{display:grid;gap:14px;font-family:var(--serif);font-size:20px}
  .facts b{display:block;font-size:22px}
  .days{font-family:var(--serif);font-size:clamp(34px,5vw,54px);line-height:1}
  .keyring{width:min(100%,56vh);margin:0 auto;aspect-ratio:1;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
  .keyring .frame{width:100%;height:100%}
  @keyframes rise{from{opacity:0;transform:scale(.6) translateY(30px) rotate(-8deg)}to{opacity:1;transform:none}}
  .reveal .left,.reveal .right{animation:fade 1s .5s both}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .enter{position:absolute;bottom:26px;left:0;right:0;margin:0 auto;width:max-content;animation:fade 1s 1.2s both}

  /* ---------- trip: gallery ---------- */
  .gallery{--c:var(--accent);position:relative;scroll-margin-top:64px;padding:60px 0 40px;
    background:
      radial-gradient(circle at 20px 20px, rgba(255,255,255,.07) 3px, transparent 4px) 0 0/40px 40px,
      radial-gradient(circle at 0 0, rgba(0,0,0,.18) 10px, transparent 11px) 0 0/40px 40px,
      linear-gradient(180deg, color-mix(in srgb,var(--c) 70%, #120a08), color-mix(in srgb,var(--c) 45%, #0c0706));
    box-shadow:inset 0 30px 60px rgba(0,0,0,.45), inset 0 -30px 60px rgba(0,0,0,.45)}
  .gallery h2{font-family:var(--serif);text-align:center;font-weight:600;font-size:34px;margin:0 0 30px;letter-spacing:.06em}
  .row{display:flex;gap:44px;overflow-x:auto;padding:10px 40px 40px;scroll-snap-type:x mandatory;align-items:center;scrollbar-width:thin}
  .row figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:16px;scroll-snap-align:center;flex:0 0 auto}
  .row .frame{cursor:zoom-in}
  .row .frame.tall{width:min(62vw,250px);aspect-ratio:3/4}
  .row .frame.wide{width:min(78vw,380px);aspect-ratio:4/3}
  .row .frame.oval{width:min(58vw,230px);aspect-ratio:3/4}
  .row .plaque{max-width:260px}

  .placard{max-width:780px;margin:0 auto;padding:56px 20px 30px;display:grid;gap:26px}
  .card{background:linear-gradient(180deg,#f6ecd6,#eadbb8);color:#2c200f;border-radius:4px;padding:28px 30px;
    box-shadow:0 20px 40px rgba(0,0,0,.45);font-family:var(--serif)}
  .card h3{margin:0 0 4px;font-size:30px}
  .card .meta{font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-bottom:14px}
  .card p{font-size:21px;line-height:1.5;margin:0}
  .card ul{margin:16px 0 0;padding-left:20px;font-size:19px;line-height:1.6}
  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-bottom:60px}

  /* ---------- lightbox / slideshow ---------- */
  .lightbox{position:fixed;inset:0;z-index:50;background:rgba(8,6,4,.94);display:none;place-items:center;padding:20px}
  .lightbox.on{display:grid}
  .lightbox img{max-width:92vw;max-height:78vh;border:10px solid #e9cf86;box-shadow:0 20px 60px rgba(0,0,0,.8);border-radius:3px}
  .lightbox .cap{text-align:center;margin-top:16px;font-family:var(--serif);font-size:24px}
  .lightbox .x{position:absolute;top:14px;right:14px}
  .lightbox .nav{position:absolute;top:50%;transform:translateY(-50%)}
  .lightbox .prev{left:12px}.lightbox .next{right:12px}
  .lightbox img.fade{animation:fade .8s both}

  /* ---------- tags page ---------- */
  .page{max-width:880px;margin:0 auto;padding:36px 16px 80px}
  .page h1{font-family:var(--serif);font-size:44px;margin:0 0 6px;font-weight:600}
  .page .lede{color:var(--muted);font-size:17px;line-height:1.6;margin:0 0 28px}
  .steps{background:var(--wall2);border:1px solid rgba(216,178,90,.2);border-radius:10px;padding:18px 22px;margin-bottom:26px;line-height:1.7}
  .steps ol{margin:6px 0 0;padding-left:20px}
  .taglist{display:grid;gap:12px}
  .tagrow{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--wall2);
    border:1px solid rgba(216,178,90,.2);border-radius:10px;padding:12px 14px}
  .tagrow .mini{width:56px;height:56px;border-radius:50%;overflow:hidden}
  .tagrow code{display:block;font-size:13px;color:var(--plaque);word-break:break-all;margin-top:3px}
  .tagrow .uid{font-size:12px;color:var(--muted);margin-top:3px}
  .warn{background:#3a2412;border:1px solid #a86a2a;color:#ffdcb0;padding:12px 16px;border-radius:8px;margin-bottom:20px;line-height:1.5}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:60;
    background:#241a12;border:1px solid var(--gold);padding:12px 20px;border-radius:999px;transition:.3s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%)}

  @media (max-width:760px){
    .bar{padding:10px 12px}
    .bar .brand{font-size:18px}
    .bar .pill{padding:6px 11px;font-size:13px;min-height:36px}
    .bar .wall-link{display:none}
    .reveal{grid-template-columns:1fr;text-align:center;padding:70px 16px 90px;gap:18px}
    .reveal .left{text-align:center;order:1}
    .reveal .keyring{order:2;width:min(64vw,280px);margin:0 auto}
    .reveal .right{order:3}
    .facts{grid-template-columns:repeat(3,1fr);font-size:16px}
    .facts b{font-size:17px}
    .row{gap:28px;padding:10px 24px 34px}
    .tagrow{grid-template-columns:44px 1fr}
    .tagrow .mini{width:44px;height:44px}
    .tagrow .pill{grid-column:1/-1;justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="#/" id="brand">EVERAFTER</a>
  <nav>
    <button class="pill solid" id="scanBtn" hidden>Scan souvenir</button>
    <a class="pill wall-link" href="#/">The wall</a>
    <a class="pill" href="#/tags">Tag setup</a>
  </nav>
</header>
<main id="app"></main>

<div class="lightbox" id="lb" role="dialog" aria-modal="true">
  <button class="pill x" data-lb="close">Close</button>
  <button class="pill nav prev" data-lb="prev" aria-label="Previous">&#8249;</button>
  <div><img id="lbImg" alt=""><div class="cap" id="lbCap"></div></div>
  <button class="pill nav next" data-lb="next" aria-label="Next">&#8250;</button>
</div>
<div class="toast" id="toast"></div>
<audio id="music" loop></audio>

<script>
(() => {
  const M = window.MUSEUM || { trips: [] };
  const params = new URLSearchParams(location.search);
  const KIOSK = params.has("kiosk");
  const PI = params.has("pi");
  if (KIOSK) document.body.classList.add("kiosk");

  const $ = s => document.querySelector(s);
  const app = $("#app");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const normUid = u => String(u || "").toUpperCase().replace(/[^0-9A-F]/g, "");

  // oldest trip = exhibit No. 01
  const byDate = [...M.trips].sort((a, b) => (a.start || "").localeCompare(b.start || ""));
  const exhibitNo = t => String(byDate.indexOf(t) + 1).padStart(2, "0");
  const wallOrder = [...byDate].reverse();

  const parse = d => { if (!d) return null; const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd || 1); };
  const fmt = d => d ? d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
  const days = t => { const a = parse(t.start), b = parse(t.end); return a && b ? Math.round((b - a) / 864e5) + 1 : null; };
  const year = t => (t.start || "").slice(0, 4);

  document.title = `${M.title || "EverAfter"} Museum`;
  $("#brand").textContent = (M.title || "EverAfter").toUpperCase();

  function medal(t, size) {
    if (t.keychain) return `<img src="${esc(t.keychain)}" alt="${esc(t.place)} keychain">`;
    const initials = (t.place || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
    return `<div class="medal" style="--c:${esc(t.color || "#8a5a2b")}"><div class="ring"><span style="font-size:${size}px">${esc(initials)}<em>${esc(year(t))}</em></span></div></div>`;
  }

  /* ---------------- views ---------------- */
  function viewWall() {
    setAccent(null);
    const hint = KIOSK || PI ? "Hold a souvenir near the reader" : "Tap a souvenir to your phone, or choose one below";
    app.innerHTML = `
      <section class="hall">
        <div class="hero">
          <h1>${esc((M.title || "EverAfter").toUpperCase())}</h1>
          <p>${esc(M.subtitle || "")}</p>
          <div class="hint"><span class="dot"></span>${esc(hint)}</div>
        </div>
        ${M.trips.length ? `<div class="grid">${wallOrder.map(t => `
          <a class="exhibit" href="#/trip/${encodeURIComponent(t.id)}">
            <div class="spot" style="width:100%"><div class="frame oval"><div class="mat">${medal(t, 54)}</div></div></div>
            <div class="plaque"><small>No. ${exhibitNo(t)}</small><b>${esc(t.place)}</b><small>${esc(t.country)} · ${esc(year(t))}</small></div>
          </a>`).join("")}</div>`
        : `<p class="empty">No trips yet. Add your first one in trips.js.</p>`}
      </section>`;
  }

  let current = null;
  function viewTrip(id) {
    const t = M.trips.find(x => x.id === id);
    if (!t) { toast("That souvenir isn't in the museum yet"); location.hash = "#/"; return; }
    current = t;
    setAccent(t.color);
    const n = days(t);
    const shapes = ["oval", "tall", "wide", "tall"];
    const photos = t.photos || [];
    app.innerHTML = `
      <section class="reveal" style="--c:${esc(t.color || "#8a5a2b")}">
        <div class="tag">NFC MEMORY FOUND</div>
        <div class="left">
          <div class="label">Destination</div>
          <div class="dest">${esc(t.place)}</div>
          <div class="country">${esc(t.country)}</div>
          <div class="label" style="margin-top:14px">Exhibit No. ${exhibitNo(t)}</div>
        </div>
        <div class="keyring"><div class="frame oval"><div class="mat">${medal(t, 90)}</div></div></div>
        <div class="right">
          <div class="facts">
            <div><div class="label">Arrived</div><b>${esc(fmt(parse(t.start)))}</b></div>
            <div><div class="label">Departed</div><b>${esc(fmt(parse(t.end)))}</b></div>
            ${n ? `<div><div class="label">Stayed</div><span class="days">${n}</span> days</div>` : ""}
          </div>
        </div>
        <button class="pill enter" id="enterBtn">Enter the gallery &#8595;</button>
      </section>

      <section class="gallery" id="gallery" style="--c:${esc(t.color || "#8a5a2b")}">
        <h2>${esc(t.place)} Gallery</h2>
        ${photos.length ? `<div class="row">${photos.map((p, i) => {
          const s = shapes[i % shapes.length];
          return `<figure>
            <div class="frame ${s}" data-i="${i}"><div class="mat"><img loading="lazy" src="${esc(p.src)}" alt="${esc(p.caption || t.place)}"></div></div>
            ${p.caption ? `<div class="plaque"><b>${esc(p.caption)}</b></div>` : ""}
          </figure>`;}).join("")}</div>`
        : `<p class="empty">Add photos for this trip in trips.js</p>`}
      </section>

      <section class="placard">
        <div class="card">
          <h3>${esc(t.place)}, ${esc(t.country)}</h3>
          <div class="meta">${esc(fmt(parse(t.start)))} to ${esc(fmt(parse(t.end)))}</div>
          ${t.story ? `<p>${esc(t.story)}</p>` : ""}
          ${(t.highlights || []).length ? `<ul>${t.highlights.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
        </div>
      </section>
      <div class="actions">
        ${photos.length ? `<button class="pill solid" id="slideBtn">Play slideshow</button>` : ""}
        ${t.music ? `<button class="pill" id="musicBtn">Play music</button>` : ""}
        <a class="pill" href="#/">Back to the wall</a>
      </div>`;

    $("#enterBtn").onclick = () => $("#gallery").scrollIntoView({ behavior: "smooth" });
    app.querySelectorAll(".row .frame").forEach(f => f.onclick = () => openLb(+f.dataset.i));
    const sb = $("#slideBtn"); if (sb) sb.onclick = () => openLb(0, true);
    const mb = $("#musicBtn"); if (mb) mb.onclick = () => toggleMusic(t, mb);
    // museum screens: glide into the gallery, then start the slideshow on their own
    if (KIOSK && photos.length) {
      clearTimeout(viewTrip.t1); clearTimeout(viewTrip.t2);
      viewTrip.t1 = setTimeout(() => current === t && $("#gallery")?.scrollIntoView({ behavior: "smooth" }), 4500);
      viewTrip.t2 = setTimeout(() => current === t && openLb(0, true), 9000);
    }
  }

  function viewTags() {
    setAccent(null);
    const base = location.origin + location.pathname;
    const local = location.protocol === "file:" || /^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname);
    app.innerHTML = `
      <div class="page">
        <h1>Tag setup</h1>
        <p class="lede">Each keychain gets a sticker that holds one link. Any phone that taps it opens that trip: iPhones, Android phones, and your guests' phones too. No app to install.</p>
        ${local ? `<div class="warn">You're viewing this from ${location.protocol === "file:" ? "a file on your computer" : "a local address"}. Put the museum online first (see SETUP.md), then open this page from the online address so the links below are ones any phone can reach.</div>` : ""}
        <div class="steps"><b>Write a tag</b> (free <i>NFC Tools</i> app, iPhone or Android)
          <ol>
            <li>Tap <b>Copy</b> next to a trip below.</li>
            <li>In NFC Tools: <b>Write</b> &#8594; <b>Add a record</b> &#8594; <b>URL/URI</b> &#8594; paste.</li>
            <li>Tap <b>Write</b> and hold the sticker to the top of your phone (iPhone) or the middle of the back (Android).</li>
            <li>Stick it on the back of the keychain. Test it, then lock it in NFC Tools (<b>Other</b> &#8594; <b>Lock tag</b>) only once you're sure the link is final.</li>
          </ol>
        </div>
        <div class="taglist">${byDate.map(t => {
          const url = `${base}#/trip/${encodeURIComponent(t.id)}`;
          return `<div class="tagrow">
            <div class="mini">${medal(t, 20)}</div>
            <div><b>No. ${exhibitNo(t)} · ${esc(t.place)}</b><code>${esc(url)}</code>
              <div class="uid">Pi reader ID: ${t.tagUid ? esc(t.tagUid) : "not set (only needed for the Raspberry Pi version)"}</div></div>
            <button class="pill" data-copy="${esc(url)}">Copy</button>
          </div>`;}).join("")}</div>
        ${"NDEFReader" in window ? `<div class="steps" style="margin-top:26px"><b>Find a tag's ID</b> (for the Raspberry Pi reader later)<br>
          <button class="pill solid" id="uidBtn" style="margin-top:10px">Read a tag's ID</button> <span id="uidOut"></span></div>` : ""}
      </div>`;
    app.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; }
      catch { prompt("Copy this link", b.dataset.copy); }
      setTimeout(() => b.textContent = "Copy", 1600);
    });
    const ub = $("#uidBtn");
    if (ub) ub.onclick = async () => {
      try {
        const r = new NDEFReader(); await r.scan(); $("#uidOut").textContent = "Hold a tag to the phone...";
        r.onreading = e => $("#uidOut").textContent = "ID: " + (e.serialNumber || "unknown").toUpperCase();
      } catch (e) { $("#uidOut").textContent = "Couldn't start the reader: " + e.message; }
    };
  }

  function setAccent(c) { document.documentElement.style.setProperty("--accent", c || "#b3342f"); }

  /* ---------------- lightbox + slideshow ---------------- */
  let lbI = 0, lbTimer = null;
  function openLb(i, auto) {
    if (!current?.photos?.length) return;
    lbI = i; showLb(); $("#lb").classList.add("on");
    clearInterval(lbTimer);
    if (auto) lbTimer = setInterval(() => { lbI = (lbI + 1) % current.photos.length; showLb(); }, 5000);
  }
  function showLb() {
    const p = current.photos[lbI], img = $("#lbImg");
    img.classList.remove("fade"); void img.offsetWidth; img.classList.add("fade");
    img.src = p.src; img.alt = p.caption || ""; $("#lbCap").textContent = p.caption || "";
  }
  function closeLb() { $("#lb").classList.remove("on"); clearInterval(lbTimer); }
  $("#lb").addEventListener("click", e => {
    const a = e.target.dataset.lb;
    if (a === "close" || e.target.id === "lb") closeLb();
    if (a === "next") { lbI = (lbI + 1) % current.photos.length; showLb(); }
    if (a === "prev") { lbI = (lbI - 1 + current.photos.length) % current.photos.length; showLb(); }
  });
  addEventListener("keydown", e => {
    if (!$("#lb").classList.contains("on")) return;
    if (e.key === "Escape") closeLb();
    if (e.key === "ArrowRight") $("[data-lb=next]").click();
    if (e.key === "ArrowLeft") $("[data-lb=prev]").click();
  });

  /* ---------------- music ---------------- */
  function toggleMusic(t, btn) {
    const a = $("#music");
    if (!a.paused && a.dataset.trip === t.id) { a.pause(); btn.textContent = "Play music"; return; }
    a.src = t.music; a.dataset.trip = t.id; a.play().catch(() => {}); btn.textContent = "Pause music";
  }

  /* ---------------- toast ---------------- */
  function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }

  /* ---------------- open a trip from a scan ---------------- */
  function openFromScan({ url, uid }) {
    let id = null;
    const m = url && url.match(/#\/trip\/([^?&#]+)/);
    if (m) id = decodeURIComponent(m[1]);
    if (!id && uid) id = M.trips.find(t => t.tagUid && normUid(t.tagUid) === normUid(uid))?.id;
    if (id && M.trips.some(t => t.id === id)) { closeLb(); location.hash = "#/trip/" + encodeURIComponent(id); }
    else toast("That souvenir isn't in the museum yet");
  }

  // Android Chrome can read tags inside the page (handy on an NFC Android tablet used as the museum screen)
  if ("NDEFReader" in window && /Android/i.test(navigator.userAgent)) {
    const btn = $("#scanBtn"); btn.hidden = false;
    let reading = false;
    const start = async () => {
      if (reading) return;
      try {
        const r = new NDEFReader(); await r.scan(); reading = true;
        btn.textContent = "Reader on"; toast("Hold a souvenir to the device");
        r.onreading = e => {
          const rec = [...e.message.records].find(x => x.recordType === "url" || x.recordType === "absolute-url");
          const url = rec ? new TextDecoder().decode(rec.data) : "";
          openFromScan({ url, uid: e.serialNumber });
        };
      } catch (e) { toast("Couldn't start the reader: " + e.message); }
    };
    btn.onclick = start;
  }

  // Raspberry Pi: pi_reader.py writes scan.json whenever a tag touches the PN532
  if (PI) {
    let last = null;
    setInterval(async () => {
      try {
        const r = await fetch("scan.json?ts=" + Date.now(), { cache: "no-store" });
        if (!r.ok) return;
        const s = await r.json();
        if (last === null) { last = s.at; return; }       // ignore whatever was there at startup
        if (s.at !== last) { last = s.at; openFromScan({ uid: s.uid, url: s.url }); }
      } catch {}
    }, 600);
  }

  // Museum screens drift back to the wall when nobody is touching them
  if (KIOSK) {
    let idle;
    const reset = () => { clearTimeout(idle); idle = setTimeout(() => { closeLb(); if (location.hash !== "#/") location.hash = "#/"; }, (M.kioskIdleMinutes || 3) * 60000); };
    ["pointerdown", "keydown", "hashchange"].forEach(ev => addEventListener(ev, reset));
    reset();
  }

  /* ---------------- router ---------------- */
  function route() {
    const h = location.hash || "#/";
    closeLb(); current = null;
    const trip = h.match(/^#\/trip\/([^?&#]+)/);
    if (trip) viewTrip(decodeURIComponent(trip[1]));
    else if (h.startsWith("#/tags")) viewTags();
    else viewWall();
    scrollTo(0, 0);
  }
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
