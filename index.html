<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0906">
<title>Pran Travels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="trips.js"></script>
<style>
:root{
  --bg:#0d0906; --bg2:#17110c; --ink:#f6ecd9; --muted:#b3a286; --dim:#7d6f5a;
  --gold:#d9b35b; --gold2:#f6e2a4; --gold3:#9c7424; --line:rgba(217,179,91,.22);
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  --goldtext:linear-gradient(100deg,#a87a26 0%,#f4dc98 18%,#c8993c 36%,#fff3cc 50%,#c8993c 64%,#f4dc98 82%,#a87a26 100%);
  --mx:50%; --my:30%;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit}
::selection{background:rgba(217,179,91,.35)}

/* ---------- ambient layers ---------- */
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.spot{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(650px circle at var(--mx) var(--my), rgba(255,206,130,.11), transparent 60%),
             radial-gradient(1200px 700px at 50% -10%, rgba(255,200,120,.08), transparent 70%)}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55))}
main{position:relative;z-index:1}

/* ---------- top bar ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 18px;transition:background .4s,border-color .4s,backdrop-filter .4s;border-bottom:1px solid transparent}
.bar.solid{background:rgba(13,9,6,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:var(--line)}
.brand{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.22em;white-space:nowrap;background:var(--goldtext);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
.bar nav{margin-left:auto;display:flex;gap:6px}
.pill{border:1px solid rgba(217,179,91,.4);background:rgba(13,9,6,.35);padding:8px 16px;border-radius:999px;font-size:13px;letter-spacing:.06em;display:inline-flex;align-items:center;gap:8px;min-height:38px;transition:background .25s,border-color .25s,transform .25s}
.pill:hover{background:rgba(217,179,91,.14);border-color:var(--gold)}
.pill.solid{background:linear-gradient(135deg,#f3d98b,#c9983b);color:#1f1507;border-color:transparent;font-weight:600}
.pill.solid:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(217,179,91,.3)}
.kiosk .bar{display:none}
.kiosk{cursor:default;user-select:none;-webkit-user-select:none}

/* ---------- page transitions ---------- */
#app{transition:opacity .35s ease, transform .35s ease, filter .35s ease}
#app.leave{opacity:0;transform:scale(.985);filter:blur(6px)}

/* ---------- reveal on scroll ---------- */
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

@keyframes shine{to{background-position:-200% center}}
@keyframes up{from{opacity:0;transform:translateY(.5em) rotateX(-40deg)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(217,179,91,0)}100%{box-shadow:0 0 0 0 rgba(217,179,91,0)}}
@keyframes drop{0%{transform:translateY(-100%)}100%{transform:translateY(200%)}}
@keyframes flipIn{0%{transform:perspective(900px) rotateY(-540deg) scale(.35);opacity:0}55%{opacity:1}100%{transform:perspective(900px) rotateY(0) scale(1);opacity:1}}
@keyframes float{50%{transform:translateY(-8px)}}

/* ---------- gold frame / medal ---------- */
.frame{position:relative;padding:12px;border-radius:6px;background:linear-gradient(135deg,#7a5816 0%,#f3d98b 22%,#a47b24 45%,#f8e6a8 68%,#8a651c 100%);
  box-shadow:inset 0 0 0 2px rgba(60,40,5,.55),inset 0 0 0 6px rgba(255,240,190,.22),0 20px 45px rgba(0,0,0,.6)}
.frame>.mat{background:#0d0906;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 18px rgba(0,0,0,.9);height:100%}
.frame.oval,.frame.oval>.mat{border-radius:50%}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.medal{width:100%;height:100%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 70%, white) 0%, var(--c) 45%, color-mix(in srgb,var(--c) 55%, black) 100%)}
.medal .ring{width:78%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;border:3px solid rgba(255,235,180,.85);box-shadow:inset 0 0 0 6px rgba(0,0,0,.15)}
.medal.flag .ring{background:rgba(20,12,8,.34)}
.medal .ring span{font-family:var(--serif);color:#fff7e2;font-weight:700;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.medal .ring em{display:block;font-style:normal;font-family:var(--sans);font-weight:500;font-size:.26em;letter-spacing:.2em;margin-top:.45em;opacity:.95}
.medal .ring em.long{font-size:.19em;letter-spacing:.1em}

/* 3D tilt + glare */
.tilt{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;will-change:transform}
.tilt.live{transition:transform .08s linear}
.coin{position:relative;border-radius:50%}
.coin .glare{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:soft-light;opacity:0;transition:opacity .4s;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,30%), rgba(255,255,255,.85), transparent 45%)}
.tilt.live .glare,.coin:hover .glare{opacity:1}

/* ---------- HOME: hero ---------- */
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:100px 16px 60px;position:relative}
.eyebrow{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);animation:fade 1.4s .2s both}
.title{font-family:var(--serif);font-weight:500;font-size:clamp(64px,15vw,168px);line-height:.88;letter-spacing:.06em;margin:18px 0 10px;perspective:600px}
.title .w{display:block}
.title .ch{display:inline-block;background:var(--goldtext);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:up 1.1s cubic-bezier(.2,.8,.2,1) both, shine 7s linear infinite;animation-delay:calc(var(--i) * 70ms + .3s), 0s}
.tagline{font-family:var(--serif);font-style:italic;font-size:clamp(20px,3.6vw,30px);color:var(--muted);margin:6px 0 0;animation:fade 1.4s 1.1s both}
.hint{display:inline-flex;align-items:center;gap:12px;margin-top:30px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;font-size:13px;letter-spacing:.08em;color:var(--gold2);background:rgba(13,9,6,.4);animation:fade 1.4s 1.4s both}
.hint .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(217,179,91,.7);animation:pulse 1.8s infinite}
.cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:10px;letter-spacing:.35em;color:var(--dim);animation:fade 1.4s 2s both}
.cue i{display:block;width:1px;height:46px;background:rgba(217,179,91,.18);overflow:hidden;position:relative}
.cue i:after{content:"";position:absolute;left:0;top:0;width:1px;height:50%;background:var(--gold);animation:drop 1.8s ease-in-out infinite}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);max-width:900px;margin:0 auto;padding:0 16px 30px;gap:1px}
.stat{text-align:center;padding:26px 10px;position:relative}
.stat+.stat:before{content:"";position:absolute;left:0;top:25%;bottom:25%;width:1px;background:var(--line)}
.stat b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(38px,6vw,58px);line-height:1;background:var(--goldtext);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{display:block;margin-top:8px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

/* section heading */
.sec{text-align:center;padding:70px 16px 10px}
.sec small{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted)}
.sec h2{font-family:var(--serif);font-weight:500;font-size:clamp(36px,6vw,56px);margin:10px 0 0;letter-spacing:.04em}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;color:var(--gold)}
.orn:before,.orn:after{content:"";width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn:after{transform:scaleX(-1)}

/* ---------- HOME: timeline ---------- */
.tl{position:relative;max-width:1060px;margin:0 auto;padding:40px 18px 80px}
.tl .rail{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:rgba(217,179,91,.12)}
.tl .rail i{position:absolute;left:0;top:0;width:100%;height:var(--p,0%);background:linear-gradient(var(--gold2),var(--gold) 80%,transparent);box-shadow:0 0 12px rgba(217,179,91,.6)}
.yr{position:relative;display:flex;justify-content:center;margin:70px 0 26px;z-index:2}
.yr span{font-family:var(--serif);font-size:clamp(40px,6vw,64px);font-weight:500;padding:0 22px;background:var(--bg);line-height:1;
  background-image:var(--goldtext);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:0}
.yr:before{content:"";position:absolute;left:50%;top:50%;width:180px;height:70px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,var(--bg) 55%,transparent 72%);z-index:-1}
.ex{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:90px;margin:34px 0;--c:#8a5a2b}
.ex:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%) scale(.4);background:var(--gold);box-shadow:0 0 0 5px var(--bg),0 0 0 6px rgba(217,179,91,.4),0 0 22px var(--c);transition:transform .6s .2s;z-index:2}
.ex.in:after{transform:translate(-50%,-50%) scale(1)}
.ex .side{display:flex}
.ex .side.a{justify-content:flex-end}
.ex .coinwrap{width:min(250px,100%);position:relative;opacity:0;transform:translateX(-50px) rotate(-8deg);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
.ex .coinwrap:before{content:"";position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,transparent),transparent 65%);filter:blur(10px);opacity:.75;z-index:-1;transition:opacity .4s}
.ex:hover .coinwrap:before{opacity:1}
.ex .coin .frame{aspect-ratio:1}
.ex .info{opacity:0;transform:translateX(50px);transition:opacity 1s .12s cubic-bezier(.2,.7,.2,1),transform 1s .12s cubic-bezier(.2,.7,.2,1);max-width:400px}
.ex.flip .side.a{order:2;justify-content:flex-start}
.ex.flip .info{justify-self:end;text-align:right;transform:translateX(-50px)}
.ex.flip .coinwrap{transform:translateX(50px) rotate(8deg)}
.ex.in .coinwrap,.ex.in .info{opacity:1;transform:none}
.info .no{font-size:11px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
.info h3{font-family:var(--serif);font-weight:600;font-size:clamp(36px,4.6vw,54px);line-height:1;margin:8px 0 6px;transition:letter-spacing .5s}
.ex:hover .info h3{letter-spacing:.02em}
.info .sub{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--gold2)}
.info .when{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ex.flip .chips{justify-content:flex-end}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.03)}
.open{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.open i{display:inline-block;width:28px;height:1px;background:var(--gold);transition:width .4s}
.ex:hover .open i{width:52px}
.end{text-align:center;padding:40px 16px 110px;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:22px}
.end .seal{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);font-family:var(--serif);font-style:normal;font-size:26px;animation:float 5s ease-in-out infinite}

/* ---------- TRIP ---------- */
.reveal{position:relative;min-height:100svh;display:grid;grid-template-columns:1fr minmax(240px,400px) 1fr;align-items:center;gap:30px;padding:90px 36px 90px;overflow:hidden;
  background:radial-gradient(circle at 50% 50%, color-mix(in srgb,var(--c) 42%, #2a1d15) 0%, color-mix(in srgb,var(--c) 18%, #140e0a) 38%, transparent 72%)}
.reveal .band{position:absolute;top:0;left:0;right:0;height:5px;opacity:.95;z-index:31}
.reveal .tag{position:absolute;top:84px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.34em;background:rgba(13,9,6,.55);border:1px solid rgba(255,255,255,.16);padding:7px 16px;border-radius:999px;white-space:nowrap;animation:fade 1s .9s both}
.reveal .left{text-align:right}
.label{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.dest{font-family:var(--serif);font-weight:600;font-size:clamp(48px,7.5vw,100px);line-height:.92;margin:10px 0;perspective:500px}
.dest .ch{display:inline-block;animation:up .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms + .7s)}
.subl{font-family:var(--serif);font-style:italic;font-size:clamp(19px,2.6vw,28px);color:var(--gold2);animation:fade 1.2s 1.2s both}
.reveal .left .label,.reveal .right{animation:fade 1.2s 1.3s both}
.facts{display:grid;gap:18px;font-family:var(--serif);font-size:20px}
.facts b{display:block;font-size:24px;font-weight:600}
.big{font-family:var(--serif);font-size:clamp(46px,6vw,72px);line-height:1;font-weight:500;background:var(--goldtext);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-coin{width:min(100%,58vh);margin:0 auto;aspect-ratio:1;animation:flipIn 1.6s cubic-bezier(.2,.8,.2,1) both}
.hero-coin .coin,.hero-coin .frame{width:100%;height:100%}
.hero-coin .halo{position:absolute;inset:-22%;border-radius:50%;background:conic-gradient(from 0deg, transparent, rgba(255,220,150,.22), transparent 30%, rgba(255,220,150,.16), transparent 60%);animation:spin 18s linear infinite;z-index:-1;filter:blur(6px)}
@keyframes spin{to{transform:rotate(360deg)}}
.enter{position:absolute;bottom:28px;left:0;right:0;margin:0 auto;width:max-content;animation:fade 1s 1.8s both}
#burst{position:fixed;inset:0;pointer-events:none;z-index:40}

.gallery{position:relative;scroll-margin-top:60px;padding:90px 0 60px;--c:#8a5a2b;
  background:radial-gradient(circle at 20px 20px, rgba(255,255,255,.06) 2.5px, transparent 3.5px) 0 0/38px 38px,
  linear-gradient(180deg, transparent, color-mix(in srgb,var(--c) 38%, #120a08) 18%, color-mix(in srgb,var(--c) 30%, #0c0706) 82%, transparent)}
.gallery h2{font-family:var(--serif);text-align:center;font-weight:500;font-size:clamp(36px,5vw,54px);margin:0 0 36px;letter-spacing:.04em}
.row{display:flex;gap:46px;overflow-x:auto;padding:10px 40px 40px;scroll-snap-type:x mandatory;align-items:center;justify-content:safe center;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row figure{margin:0;flex:0 0 auto;scroll-snap-align:center}
.row .frame{cursor:zoom-in}
.row .frame.tall{width:min(62vw,260px);aspect-ratio:3/4}
.row .frame.oval{width:min(58vw,240px);aspect-ratio:3/4}
.soon .mat{display:grid;place-items:center;text-align:center;background:repeating-linear-gradient(45deg,#1a120c 0 14px,#150e09 14px 28px)}
.soon .mat div{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gold2);padding:20px}
.soon .mat small{display:block;font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.3em;color:var(--muted);margin-top:10px;text-transform:uppercase}

.placard{max-width:820px;margin:0 auto;padding:70px 16px 10px}
.card{background:linear-gradient(180deg,#f6ecd6,#e8d7b1);color:#2c200f;border-radius:6px;padding:34px 34px;box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(120,90,30,.25);font-family:var(--serif);position:relative}
.card:before{content:"";position:absolute;inset:10px;border:1px solid rgba(120,90,30,.28);border-radius:3px;pointer-events:none}
.card h3{margin:0 0 4px;font-size:34px;font-weight:600}
.card .meta{font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-bottom:14px}
.card p{font-size:21px;line-height:1.55;margin:0}
.card ul{margin:14px 0 0;padding-left:20px;font-size:19px;line-height:1.6}
.rt{font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin:24px 0 12px}
.route{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
.route:before{content:"";position:absolute;left:4px;top:6px;bottom:10px;width:2px;background:rgba(90,60,10,.25)}
.route:after{content:"";position:absolute;left:4px;top:6px;width:2px;height:0;background:var(--c,#8a5a2b);transition:height 2.2s cubic-bezier(.3,.7,.2,1)}
.route.in:after{height:calc(100% - 16px)}
.route li{position:relative;padding:0 0 16px 12px;font-size:20px;line-height:1.3;opacity:0;transform:translateX(-10px);transition:opacity .6s,transform .6s;transition-delay:calc(var(--i)*140ms + .2s)}
.route.in li{opacity:1;transform:none}
.route li:before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--c,#8a5a2b);box-shadow:0 0 0 3px #f1e3c3}
.route .d{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.route .n{display:block;font-size:17px;opacity:.78;font-style:italic}

.album{max-width:1240px;margin:0 auto;padding:60px 16px 30px}
.album-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.album-head h3{font-family:var(--serif);font-size:36px;margin:6px 0 0;font-weight:500}
.masonry{columns:4 220px;column-gap:12px}
.tile{display:block;width:100%;margin:0 0 12px;padding:0;border:0;background:#0d0906;border-radius:6px;overflow:hidden;break-inside:avoid;cursor:zoom-in;box-shadow:0 10px 24px rgba(0,0,0,.45);opacity:0;transform:translateY(20px) scale(.98);transition:opacity .8s,transform .8s}
.tile.in{opacity:1;transform:none}
.tile img{display:block;width:100%;height:auto;transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .5s}
.tile:hover img{transform:scale(1.05);filter:brightness(1.08)}

.pager{max-width:1000px;margin:0 auto;padding:50px 16px 30px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pg{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);transition:background .3s,border-color .3s,transform .3s}
.pg:hover{background:rgba(217,179,91,.08);border-color:var(--gold);transform:translateY(-2px)}
.pg.next{flex-direction:row-reverse;text-align:right}
.pg .m{width:64px;height:64px;flex:0 0 auto;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--gold3)}
.pg small{display:block;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.pg b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;margin-top:3px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:10px 16px 90px}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(6,4,3,.95);display:none;place-items:center;padding:20px;backdrop-filter:blur(6px)}
.lightbox.on{display:grid;animation:fade .3s both}
.lightbox img{max-width:92vw;max-height:80vh;border:10px solid #e9cf86;box-shadow:0 30px 80px rgba(0,0,0,.8);border-radius:3px}
.lightbox img.fade{animation:lbIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes lbIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.lightbox .cap{text-align:center;margin-top:16px;font-family:var(--serif);font-size:24px}
.lightbox .count{position:absolute;top:24px;left:20px;font-size:12px;letter-spacing:.2em;color:var(--muted)}
.lightbox .x{position:absolute;top:16px;right:16px}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;justify-content:center;font-size:24px;padding:0}
.lightbox .prev{left:14px}.lightbox .next{right:14px}

/* ---------- tags page ---------- */
.page{max-width:900px;margin:0 auto;padding:110px 16px 90px}
.page h1{font-family:var(--serif);font-size:52px;margin:0 0 8px;font-weight:500}
.page .lede{color:var(--muted);font-size:17px;line-height:1.6;margin:0 0 28px}
.steps{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:26px;line-height:1.7}
.steps ol{margin:6px 0 0;padding-left:20px}
.taglist{display:grid;gap:10px}
.tagrow{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tagrow .mini{width:52px;height:52px;border-radius:50%;overflow:hidden}
.tagrow code{display:block;font-size:12.5px;color:var(--gold2);word-break:break-all;margin-top:3px}
.tagrow .uid{font-size:11px;color:var(--dim);margin-top:3px}
.warn{background:#3a2412;border:1px solid #a86a2a;color:#ffdcb0;padding:12px 16px;border-radius:10px;margin-bottom:20px;line-height:1.5}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:60;background:#20170f;border:1px solid var(--gold);padding:12px 20px;border-radius:999px;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- small screens ---------- */
@media (max-width:760px){
  .bar{padding:12px 14px}.brand{font-size:16px;letter-spacing:.16em}
  .pill{padding:6px 12px;font-size:12px;min-height:34px}
  .bar .hide-s{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3):before{display:none}
  .tl{padding:20px 14px 60px}
  .tl .rail{left:26px}
  .yr{justify-content:flex-start;margin:50px 0 18px}
  .yr span{padding:0 12px 0 46px;font-size:40px}
  .yr:before{display:none}
  .ex,.ex.flip{grid-template-columns:1fr;gap:18px;padding-left:58px;margin:26px 0 40px}
  .ex:after{left:26px;top:70px}
  .ex .side.a,.ex.flip .side.a{order:0;justify-content:flex-start}
  .ex .coinwrap,.ex.flip .coinwrap{width:170px;transform:translateY(30px) rotate(-6deg)}
  .ex .info,.ex.flip .info{justify-self:start;text-align:left;transform:translateY(30px)}
  .ex.flip .chips{justify-content:flex-start}
  .info h3{font-size:38px}
  .reveal{grid-template-columns:1fr;text-align:center;padding:120px 16px 100px;gap:22px}
  .reveal .left{text-align:center;order:1}
  .hero-coin{order:2;width:min(70vw,300px)}
  .reveal .right{order:3}
  .facts{grid-template-columns:repeat(3,1fr);font-size:16px}
  .facts b{font-size:17px}
  .row{gap:26px;padding:10px 24px 34px;justify-content:flex-start}
  .masonry{columns:2;column-gap:6px}
  .tile{margin-bottom:6px;border-radius:4px}
  .lightbox img{border-width:5px}
  .lightbox .nav{display:none}
  .pager{grid-template-columns:1fr}
  .tagrow{grid-template-columns:44px 1fr}
  .tagrow .mini{width:44px;height:44px}
  .tagrow .pill{grid-column:1/-1;justify-content:center}
  .card{padding:26px 22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.ex .coinwrap,.ex .info,.tile,.route li{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<canvas id="dust"></canvas>
<div class="spot"></div>
<div class="vignette"></div>
<canvas id="burst"></canvas>

<header class="bar" id="bar">
  <a class="brand" href="#/" id="brand">PRAN TRAVELS</a>
  <nav>
    <button class="pill solid" id="scanBtn" hidden>Scan souvenir</button>
    <a class="pill hide-s" href="#/">Timeline</a>
    <a class="pill" href="#/tags">Tag setup</a>
  </nav>
</header>
<main id="app"></main>

<div class="lightbox" id="lb" role="dialog" aria-modal="true">
  <div class="count" id="lbCount"></div>
  <button class="pill x" data-lb="close">Close</button>
  <button class="pill nav prev" data-lb="prev" aria-label="Previous">&#8249;</button>
  <div><img id="lbImg" alt=""><div class="cap" id="lbCap"></div></div>
  <button class="pill nav next" data-lb="next" aria-label="Next">&#8250;</button>
</div>
<div class="toast" id="toast"></div>
<audio id="music" loop></audio>

<script>
(() => {
  const M = window.MUSEUM || { trips: [] };
  const params = new URLSearchParams(location.search);
  const KIOSK = params.has("kiosk"), PI = params.has("pi");
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (KIOSK) document.body.classList.add("kiosk");

  const $ = s => document.querySelector(s);
  const app = $("#app");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const normUid = u => String(u || "").toUpperCase().replace(/[^0-9A-F]/g, "");
  const letters = (s, cls = "ch") => [...String(s)].map((c, i) => c === " " ? " " : `<span class="${cls}" style="--i:${i}">${esc(c)}</span>`).join("");

  /* ---------- data ---------- */
  M.trips.forEach(t => {
    const p = t.photos;
    if (typeof p === "number") t.photos = Array.from({ length: p }, (_, i) => ({ src: `${t.id}-${i + 1}.jpg` }));
    else t.photos = (p || []).map(x => typeof x === "string" ? { src: x } : x);
  });
  const SEASON = { winter: "01", spring: "03", summer: "06", fall: "09", autumn: "09" };
  const sortKey = t => {
    if (t.start) return t.start;
    const y = String((t.visits && t.visits[0]) || t.year || "");
    const m = SEASON[String(t.when || "").toLowerCase().split(" ")[0]] || "01";
    return `${y}-${m}-01`;
  };
  const byDate = [...M.trips].sort((a, b) => sortKey(a).localeCompare(sortKey(b)));   // oldest first
  const exhibitNo = t => String(byDate.indexOf(t) + 1).padStart(2, "0");
  const parse = d => { if (!d) return null; const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd || 1); };
  const fmt = d => d ? d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
  const days = t => { const a = parse(t.start), b = parse(t.end); return a && b ? Math.round((b - a) / 864e5) + 1 : null; };
  const multi = t => (t.visits || []).length > 1;
  const year = t => t.start ? t.start.slice(0, 4) : String((t.visits && t.visits[t.visits.length - 1]) || t.year || "");
  const firstYear = t => sortKey(t).slice(0, 4);
  const yearLabel = t => multi(t) ? `SINCE ${t.visits[0]}` : year(t);
  const whenText = t => t.start && t.end ? `${fmt(parse(t.start))} to ${fmt(parse(t.end))}`
    : multi(t) ? `Visited ${t.visits.join(", ")}` : (t.when || year(t));
  const subLine = t => t.cities?.length ? t.cities.join(" · ") : (t.country && t.country !== t.place ? t.country : "");

  document.title = M.title || "Pran Travels";
  $("#brand").textContent = (M.title || "Pran Travels").toUpperCase();

  function flagBg(t, deg) {
    const c = t.colors; if (!c || !c.length) return "";
    const band = t.band ? `linear-gradient(90deg, ${t.band} 0 26%, transparent 26%), ` : "";
    const d = deg ?? (t.stripes === "horizontal" ? 180 : 90);
    const w = t.stripeWeights || c.map(() => 1), tot = w.reduce((a, b) => a + b, 0);
    let at = 0; const stops = c.map((col, i) => { const a = at / tot * 100; at += w[i]; return `${col} ${a}% ${at / tot * 100}%`; });
    return `${band}linear-gradient(${d}deg, ${stops.join(", ")})`;
  }
  function medal(t, size) {
    if (t.keychain) return `<img src="${esc(t.keychain)}" alt="${esc(t.place)} keychain">`;
    const initials = t.mono || (t.place || "?").split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).map(w => w[0]).join("").slice(0, 2).toUpperCase();
    const flag = flagBg(t), yl = yearLabel(t);
    return `<div class="medal${flag ? " flag" : ""}" style="--c:${esc(t.color || "#8a5a2b")}${flag ? ";background:" + flag : ""}"><div class="ring"><span style="font-size:${size}px">${esc(initials)}<em${yl.length > 5 ? ' class="long"' : ""}>${esc(yl)}</em></span></div></div>`;
  }
  const coin = (t, size) => `<div class="coin tilt"><div class="frame oval"><div class="mat">${medal(t, size)}</div></div><div class="glare"></div></div>`;

  /* ---------- ambient: pointer spotlight ---------- */
  let wander = true;
  addEventListener("pointermove", e => {
    if (e.pointerType === "touch") return;
    wander = false;
    document.documentElement.style.setProperty("--mx", e.clientX + "px");
    document.documentElement.style.setProperty("--my", e.clientY + "px");
  }, { passive: true });
  if (!REDUCED) (function drift(t = 0) {
    if (wander) {
      document.documentElement.style.setProperty("--mx", (50 + Math.sin(t / 3200) * 28) + "%");
      document.documentElement.style.setProperty("--my", (30 + Math.cos(t / 4100) * 14) + "%");
    }
    requestAnimationFrame(drift);
  })();

  /* ---------- ambient: floating gold dust ---------- */
  const dust = $("#dust"), dctx = dust.getContext("2d");
  let motes = [];
  function sizeDust() {
    const r = Math.min(devicePixelRatio || 1, 2);
    dust.width = innerWidth * r; dust.height = innerHeight * r; dctx.setTransform(r, 0, 0, r, 0, 0);
    const n = Math.round(Math.min(70, innerWidth * innerHeight / 18000));
    motes = Array.from({ length: n }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.6 + .3, s: Math.random() * .25 + .05, a: Math.random() * .5 + .15, p: Math.random() * 6.28 }));
  }
  sizeDust(); addEventListener("resize", sizeDust);
  if (!REDUCED) (function tick() {
    if (!document.hidden) {
      dctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const m of motes) {
        m.y -= m.s; m.p += .01; m.x += Math.sin(m.p) * .15;
        if (m.y < -5) { m.y = innerHeight + 5; m.x = Math.random() * innerWidth; }
        dctx.beginPath(); dctx.arc(m.x, m.y, m.r, 0, 6.283);
        dctx.fillStyle = `rgba(244,214,140,${m.a * (.6 + .4 * Math.sin(m.p * 2))})`; dctx.fill();
      }
    }
    requestAnimationFrame(tick);
  })();

  /* ---------- burst of gold when a trip opens ---------- */
  const burst = $("#burst"), bctx = burst.getContext("2d");
  function goldBurst(x, y, color) {
    if (REDUCED) return;
    const r = Math.min(devicePixelRatio || 1, 2);
    burst.width = innerWidth * r; burst.height = innerHeight * r; bctx.setTransform(r, 0, 0, r, 0, 0);
    const P = Array.from({ length: 90 }, () => { const a = Math.random() * 6.283, v = Math.random() * 7 + 2;
      return { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, r: Math.random() * 2.4 + .6, life: 1, c: Math.random() < .25 ? color : (Math.random() < .5 ? "#f6e2a4" : "#d9b35b") }; });
    (function f() {
      bctx.clearRect(0, 0, innerWidth, innerHeight);
      let alive = false;
      for (const p of P) { if (p.life <= 0) continue; alive = true;
        p.x += p.vx; p.y += p.vy; p.vy += .12; p.vx *= .985; p.life -= .014;
        bctx.globalAlpha = Math.max(p.life, 0); bctx.fillStyle = p.c; bctx.beginPath(); bctx.arc(p.x, p.y, p.r, 0, 6.283); bctx.fill(); }
      bctx.globalAlpha = 1;
      if (alive) requestAnimationFrame(f); else bctx.clearRect(0, 0, innerWidth, innerHeight);
    })();
  }

  /* ---------- 3D tilt ---------- */
  function bindTilt(root) {
    root.querySelectorAll(".tilt").forEach(el => {
      const move = e => {
        const r = el.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
        el.classList.add("live");
        el.style.setProperty("--ry", ((px - .5) * 26) + "deg"); el.style.setProperty("--rx", ((.5 - py) * 26) + "deg");
        el.style.setProperty("--gx", px * 100 + "%"); el.style.setProperty("--gy", py * 100 + "%");
      };
      const leave = () => { el.classList.remove("live"); el.style.setProperty("--rx", "0deg"); el.style.setProperty("--ry", "0deg"); };
      el.addEventListener("pointermove", move); el.addEventListener("pointerleave", leave); el.addEventListener("pointerup", leave);
    });
  }

  /* ---------- scroll reveal ---------- */
  let io;
  function observe(root) {
    io?.disconnect();
    io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .18, rootMargin: "0px 0px -6% 0px" });
    root.querySelectorAll(".rv,.ex,.tile,.route").forEach(el => io.observe(el));
  }

  /* ---------- scroll: bar + timeline progress ---------- */
  function onScroll() {
    $("#bar").classList.toggle("solid", scrollY > 40);
    const tl = $(".tl");
    if (tl) {
      const r = tl.getBoundingClientRect(), p = Math.min(1, Math.max(0, (innerHeight * .6 - r.top) / r.height));
      tl.style.setProperty("--p", (p * 100).toFixed(1) + "%");
    }
  }
  addEventListener("scroll", onScroll, { passive: true });

  /* ---------- count-up ---------- */
  function countUp(root) {
    root.querySelectorAll("[data-count]").forEach(el => {
      const to = +el.dataset.count; if (REDUCED) { el.textContent = to; return; }
      const obs = new IntersectionObserver(([e]) => { if (!e.isIntersecting) return; obs.disconnect();
        const t0 = performance.now(), dur = 1400;
        (function f(now) { const k = Math.min(1, (now - t0) / dur), v = Math.round(to * (1 - Math.pow(1 - k, 3))); el.textContent = v; if (k < 1) requestAnimationFrame(f); })(t0);
      }); obs.observe(el);
    });
  }

  /* ================= VIEWS ================= */
  function viewHome() {
    setAccent(null);
    const hint = KIOSK || PI ? "Hold a souvenir near the reader" : "Tap a souvenir to your phone, or explore below";
    const years = byDate.map(t => +firstYear(t)).filter(Boolean);
    const lastYear = Math.max(...M.trips.map(t => +year(t) || 0));
    const places = new Set(); M.trips.forEach(t => { places.add(t.place); (t.cities || []).forEach(c => places.add(c)); (t.stops || []).forEach(s => places.add(s.place)); });
    const [w1, ...rest] = (M.title || "Pran Travels").toUpperCase().split(" ");
    let prevYear = null, side = 0;
    const items = byDate.map(t => {
      const y = firstYear(t); let head = "";
      if (y !== prevYear) { head = `<div class="yr rv"><span>${esc(y)}</span></div>`; prevYear = y; }
      const flip = side++ % 2 === 1;
      const chips = (t.cities || []).slice(0, 6).map(c => `<span class="chip">${esc(c)}</span>`).join("");
      return head + `
        <a class="ex${flip ? " flip" : ""}" href="#/trip/${encodeURIComponent(t.id)}" style="--c:${esc(t.color || "#8a5a2b")}" data-id="${esc(t.id)}">
          <div class="side a"><div class="coinwrap">${coin(t, 66)}</div></div>
          <div class="info">
            <div class="no">Exhibit No. ${exhibitNo(t)}</div>
            <h3>${esc(t.place)}</h3>
            ${subLine(t) && !t.cities?.length ? `<div class="sub">${esc(subLine(t))}</div>` : (t.country && t.country !== t.place ? `<div class="sub">${esc(t.country)}</div>` : "")}
            <div class="when">${esc(whenText(t))}</div>
            ${chips ? `<div class="chips">${chips}</div>` : ""}
            <span class="open">Open exhibit <i></i></span>
          </div>
        </a>`;
    }).join("");
    app.innerHTML = `
      <section class="hero">
        <div>
          <div class="eyebrow">Est. ${years[0] || ""} &nbsp;·&nbsp; A private collection</div>
          <h1 class="title"><span class="w">${letters(w1)}</span>${rest.length ? `<span class="w">${letters(rest.join(" "))}</span>` : ""}</h1>
          <p class="tagline">${esc(M.subtitle || "")}</p>
          <div class="hint"><span class="dot"></span>${esc(hint)}</div>
        </div>
        <a class="cue" href="#tl" data-scroll>SCROLL<i></i></a>
      </section>
      <section class="stats rv">
        <div class="stat"><b data-count="${M.trips.length}">0</b><span>Exhibits</span></div>
        <div class="stat"><b data-count="${places.size}">0</b><span>Places</span></div>
        <div class="stat"><b data-count="${lastYear - (years[0] || lastYear) + 1}">0</b><span>Years of travel</span></div>
        <div class="stat"><b>${years[0] || ""}</b><span>First exhibit</span></div>
      </section>
      <div class="sec rv" id="tl"><small>The collection</small><h2>A Timeline of Journeys</h2><div class="orn">&#10022;</div></div>
      <section class="tl"><div class="rail"><i></i></div>${items}</section>
      <div class="end rv"><div class="seal">&#10022;</div>More exhibits coming soon</div>`;
    app.querySelector("[data-scroll]").onclick = e => { e.preventDefault(); $("#tl").scrollIntoView({ behavior: "smooth" }); };
    app.querySelectorAll(".ex").forEach(a => a.addEventListener("click", e => {
      const r = a.querySelector(".coin").getBoundingClientRect();
      sessionStorageSet("burstFrom", JSON.stringify({ x: r.left + r.width / 2, y: r.top + r.height / 2 }));
    }));
    bindTilt(app); observe(app); countUp(app); onScroll();
  }

  let current = null;
  function viewTrip(id) {
    const t = M.trips.find(x => x.id === id);
    if (!t) { toast("That souvenir isn't in the museum yet"); location.hash = "#/"; return; }
    current = t; setAccent(t.color);
    const n = days(t), photos = t.photos || [], idx = byDate.indexOf(t);
    const prev = byDate[idx - 1], next = byDate[idx + 1];
    const shapes = ["tall", "oval", "tall"];
    const facts = t.start && t.end ? `
        <div><div class="label">Arrived</div><b>${esc(fmt(parse(t.start)))}</b></div>
        <div><div class="label">Departed</div><b>${esc(fmt(parse(t.end)))}</b></div>
        ${n ? `<div><div class="label">Stayed</div><span class="big" data-count="${n}">0</span> days</div>` : ""}`
      : multi(t) ? `
        <div><div class="label">Visits</div><span class="big" data-count="${t.visits.length}">0</span> trips</div>
        <div><div class="label">Years</div><b>${esc(t.visits.join(" · "))}</b></div>`
      : `<div><div class="label">When</div><b>${esc(t.when || year(t))}</b></div>
         ${t.country && t.country !== t.place ? `<div><div class="label">Where</div><b>${esc(t.country)}</b></div>` : ""}`;
    const hasCard = t.story || (t.highlights || []).length || (t.stops || []).length;
    app.innerHTML = `
      <section class="reveal" style="--c:${esc(t.color || "#8a5a2b")}">
        ${t.colors ? `<div class="band" style="background:${flagBg(t, 90)}"></div>` : ""}
        <div class="tag">NFC MEMORY FOUND</div>
        <div class="left">
          <div class="label">Exhibit No. ${exhibitNo(t)}</div>
          <div class="dest">${letters(t.place)}</div>
          ${subLine(t) ? `<div class="subl">${esc(subLine(t))}</div>` : ""}
        </div>
        <div class="hero-coin" style="position:relative"><div class="halo"></div>${coin(t, 96)}</div>
        <div class="right"><div class="facts">${facts}</div></div>
        <button class="pill enter" id="enterBtn">Enter the gallery &#8595;</button>
      </section>

      <section class="gallery" id="gallery" style="--c:${esc(t.color || "#8a5a2b")}">
        <h2 class="rv">${esc(t.place)}</h2>
        <div class="row">${photos.length ? photos.slice(0, 3).map((p, i) => `<figure class="rv" style="transition-delay:${i * 120}ms">
            <div class="frame ${shapes[i]} tilt" data-i="${i}"><div class="mat"><img src="${esc(p.src)}" alt=""></div></div></figure>`).join("")
          : `<figure class="rv"><div class="frame tall soon"><div class="mat"><div>Photos coming soon<small>${esc(t.place)}</small></div></div></div></figure>`}</div>
      </section>

      ${hasCard ? `<section class="placard rv" style="--c:${esc(t.color || "#8a5a2b")}">
        <div class="card">
          <h3>${esc(t.country && t.country !== t.place ? t.place + ", " + t.country : t.place)}</h3>
          <div class="meta">${esc(whenText(t))}</div>
          ${t.story ? `<p>${esc(t.story)}</p>` : ""}
          ${(t.highlights || []).length ? `<ul>${t.highlights.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
          ${(t.stops || []).length ? `<div class="rt">The route</div><ol class="route">${t.stops.map((st, i) => `<li style="--i:${i}">${st.date ? `<span class="d">${esc(parse(st.date).toLocaleDateString(undefined, { month: "short", day: "numeric" }))}</span>` : ""}<b>${esc(st.place)}</b>${st.note ? `<span class="n">${esc(st.note)}</span>` : ""}</li>`).join("")}</ol>` : ""}
        </div>
      </section>` : ""}

      ${photos.length ? `<section class="album">
        <div class="album-head rv">
          <div><div class="label">The full album</div><h3>${photos.length} photo${photos.length === 1 ? "" : "s"}</h3></div>
          <button class="pill solid" id="slideBtn">&#9654; Play slideshow</button>
        </div>
        <div class="masonry">${photos.map((p, i) => `<button class="tile" data-i="${i}" style="transition-delay:${(i % 8) * 60}ms" aria-label="Open photo ${i + 1}"><img loading="lazy" decoding="async" src="${esc(p.src)}" alt=""></button>`).join("")}</div>
      </section>` : ""}

      <nav class="pager rv">
        ${prev ? `<a class="pg prev" href="#/trip/${encodeURIComponent(prev.id)}"><div class="m">${medal(prev, 20)}</div><div><small>&#8592; Previous exhibit</small><b>${esc(prev.place)}</b></div></a>` : "<span></span>"}
        ${next ? `<a class="pg next" href="#/trip/${encodeURIComponent(next.id)}"><div class="m">${medal(next, 20)}</div><div><small>Next exhibit &#8594;</small><b>${esc(next.place)}</b></div></a>` : "<span></span>"}
      </nav>
      <div class="actions">
        ${t.music ? `<button class="pill" id="musicBtn">Play music</button>` : ""}
        <a class="pill" href="#/">Back to the timeline</a>
      </div>`;

    $("#enterBtn").onclick = () => $("#gallery").scrollIntoView({ behavior: "smooth" });
    app.querySelectorAll(".row .frame[data-i], .tile").forEach(f => f.onclick = () => openLb(+f.dataset.i));
    const sb = $("#slideBtn"); if (sb) sb.onclick = () => openLb(0, true);
    const mb = $("#musicBtn"); if (mb) mb.onclick = () => toggleMusic(t, mb);
    bindTilt(app); observe(app); countUp(app); onScroll();

    // gold burst from the medallion as it lands
    setTimeout(() => {
      const c = app.querySelector(".hero-coin"); if (!c || current !== t) return;
      const r = c.getBoundingClientRect(); goldBurst(r.left + r.width / 2, r.top + r.height / 2, t.color || "#d9b35b");
    }, 1250);

    if (KIOSK && photos.length) {
      clearTimeout(viewTrip.t1); clearTimeout(viewTrip.t2);
      viewTrip.t1 = setTimeout(() => current === t && $("#gallery")?.scrollIntoView({ behavior: "smooth" }), 5000);
      viewTrip.t2 = setTimeout(() => current === t && openLb(0, true), 10000);
    }
  }

  function viewTags() {
    setAccent(null);
    const base = location.origin + location.pathname;
    const local = location.protocol === "file:" || /^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname);
    app.innerHTML = `
      <div class="page">
        <h1 class="rv">Tag setup</h1>
        <p class="lede rv">Each keychain gets a sticker that holds one link. Any phone that taps it opens that trip: iPhones, Android phones, and your guests' phones too. No app to install.</p>
        ${local ? `<div class="warn">You're viewing this from ${location.protocol === "file:" ? "a file on your computer" : "a local address"}. Open this page from your online museum so the links below work on any phone.</div>` : ""}
        <div class="steps rv"><b>Write a tag</b> (free <i>NFC Tools</i> app, iPhone or Android)
          <ol>
            <li>Tap <b>Copy</b> next to a trip below.</li>
            <li>In NFC Tools: <b>Write</b> &#8594; <b>Add a record</b> &#8594; <b>URL/URI</b> &#8594; paste.</li>
            <li>Tap <b>Write</b> and hold the sticker to the top of your phone (iPhone) or the middle of the back (Android).</li>
            <li>Stick it on the back of the tag disc. Test it, then lock it in NFC Tools (<b>Other</b> &#8594; <b>Lock tag</b>) once you're sure.</li>
          </ol>
        </div>
        <div class="taglist">${byDate.map(t => {
          const url = `${base}#/trip/${encodeURIComponent(t.id)}`;
          return `<div class="tagrow rv">
            <div class="mini">${medal(t, 18)}</div>
            <div><b>No. ${exhibitNo(t)} · ${esc(t.place)}</b><code>${esc(url)}</code>
              <div class="uid">Pi reader ID: ${t.tagUid ? esc(t.tagUid) : "not set (only needed for the Raspberry Pi version)"}</div></div>
            <button class="pill" data-copy="${esc(url)}">Copy</button>
          </div>`;}).join("")}</div>
        ${"NDEFReader" in window ? `<div class="steps" style="margin-top:26px"><b>Find a tag's ID</b> (for the Raspberry Pi reader later)<br>
          <button class="pill solid" id="uidBtn" style="margin-top:10px">Read a tag's ID</button> <span id="uidOut"></span></div>` : ""}
      </div>`;
    app.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; }
      catch { prompt("Copy this link", b.dataset.copy); }
      setTimeout(() => b.textContent = "Copy", 1600);
    });
    const ub = $("#uidBtn");
    if (ub) ub.onclick = async () => {
      try { const r = new NDEFReader(); await r.scan(); $("#uidOut").textContent = "Hold a tag to the phone...";
        r.onreading = e => $("#uidOut").textContent = "ID: " + (e.serialNumber || "unknown").toUpperCase();
      } catch (e) { $("#uidOut").textContent = "Couldn't start the reader: " + e.message; }
    };
    observe(app); onScroll();
  }

  function setAccent(c) { document.querySelector('meta[name="theme-color"]').content = c ? c : "#0d0906"; }
  function sessionStorageSet(k, v) { try { sessionStorage.setItem(k, v); } catch {} }

  /* ---------- lightbox + slideshow ---------- */
  let lbI = 0, lbTimer = null;
  function openLb(i, auto) {
    if (!current?.photos?.length) return;
    lbI = i; showLb(); $("#lb").classList.add("on");
    clearInterval(lbTimer);
    if (auto) lbTimer = setInterval(() => { lbI = (lbI + 1) % current.photos.length; showLb(); }, 5000);
  }
  function showLb() {
    const p = current.photos[lbI], img = $("#lbImg");
    img.classList.remove("fade"); void img.offsetWidth; img.classList.add("fade");
    img.src = p.src; img.alt = p.caption || ""; $("#lbCap").textContent = p.caption || "";
    $("#lbCount").textContent = `${lbI + 1} / ${current.photos.length}`;
    [lbI + 1, lbI + 2].forEach(n => { const q = current.photos[n % current.photos.length]; if (q) new Image().src = q.src; });
  }
  function closeLb() { $("#lb").classList.remove("on"); clearInterval(lbTimer); }
  const step = d => { if (!current) return; lbI = (lbI + d + current.photos.length) % current.photos.length; showLb(); };
  $("#lb").addEventListener("click", e => {
    const a = e.target.dataset.lb;
    if (a === "close" || e.target.id === "lb") closeLb();
    if (a === "next") { clearInterval(lbTimer); step(1); }
    if (a === "prev") { clearInterval(lbTimer); step(-1); }
  });
  let sx = null;
  $("#lb").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  $("#lb").addEventListener("touchend", e => {
    if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 40) { clearInterval(lbTimer); step(dx < 0 ? 1 : -1); }
  });
  addEventListener("keydown", e => {
    if ($("#lb").classList.contains("on")) {
      if (e.key === "Escape") closeLb();
      if (e.key === "ArrowRight") step(1);
      if (e.key === "ArrowLeft") step(-1);
      return;
    }
    if (current && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      const i = byDate.indexOf(current), to = byDate[i + (e.key === "ArrowRight" ? 1 : -1)];
      if (to) location.hash = "#/trip/" + encodeURIComponent(to.id);
    }
  });

  function toggleMusic(t, btn) {
    const a = $("#music");
    if (!a.paused && a.dataset.trip === t.id) { a.pause(); btn.textContent = "Play music"; return; }
    a.src = t.music; a.dataset.trip = t.id; a.play().catch(() => {}); btn.textContent = "Pause music";
  }
  function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }

  /* ---------- scans ---------- */
  function openFromScan({ url, uid }) {
    let id = null;
    const m = url && url.match(/#\/trip\/([^?&#]+)/);
    if (m) id = decodeURIComponent(m[1]);
    if (!id && uid) id = M.trips.find(t => t.tagUid && normUid(t.tagUid) === normUid(uid))?.id;
    if (id && M.trips.some(t => t.id === id)) { closeLb(); location.hash = "#/trip/" + encodeURIComponent(id); }
    else toast("That souvenir isn't in the museum yet");
  }
  if ("NDEFReader" in window && /Android/i.test(navigator.userAgent)) {
    const btn = $("#scanBtn"); btn.hidden = false; let reading = false;
    btn.onclick = async () => {
      if (reading) return;
      try { const r = new NDEFReader(); await r.scan(); reading = true; btn.textContent = "Reader on"; toast("Hold a souvenir to the device");
        r.onreading = e => { const rec = [...e.message.records].find(x => x.recordType === "url" || x.recordType === "absolute-url");
          openFromScan({ url: rec ? new TextDecoder().decode(rec.data) : "", uid: e.serialNumber }); };
      } catch (e) { toast("Couldn't start the reader: " + e.message); }
    };
  }
  if (PI) {
    let last = null;
    setInterval(async () => {
      try { const r = await fetch("scan.json?ts=" + Date.now(), { cache: "no-store" }); if (!r.ok) return;
        const s = await r.json(); if (last === null) { last = s.at; return; }
        if (s.at !== last) { last = s.at; openFromScan({ uid: s.uid, url: s.url }); }
      } catch {}
    }, 600);
  }
  if (KIOSK) {
    let idle;
    const reset = () => { clearTimeout(idle); idle = setTimeout(() => { closeLb(); if (location.hash !== "#/") location.hash = "#/"; }, (M.kioskIdleMinutes || 3) * 60000); };
    ["pointerdown", "keydown", "hashchange"].forEach(ev => addEventListener(ev, reset)); reset();
  }

  /* ---------- router with transitions ---------- */
  let first = true;
  function render() {
    const h = location.hash || "#/";
    closeLb(); current = null;
    const trip = h.match(/^#\/trip\/([^?&#]+)/);
    if (trip) viewTrip(decodeURIComponent(trip[1]));
    else if (h.startsWith("#/tags")) viewTags();
    else viewHome();
    scrollTo({ top: 0, behavior: "instant" });
  }
  function route() {
    if (first || REDUCED) { first = false; render(); return; }
    app.classList.add("leave");
    setTimeout(() => { render(); requestAnimationFrame(() => app.classList.remove("leave")); }, 320);
  }
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
